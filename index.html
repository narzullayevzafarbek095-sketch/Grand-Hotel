    // Single Room Card with Horizontal Auto-Slider
    function RoomCardItem({ room, onBook }) {
      const [imgIdx, setImgIdx] = useState(0);
      const [isHover, setIsHover] = useState(false);
      const images = room.images || [room.image_url];

      // Auto-slide horizontally every 4.5 seconds
      useEffect(() => {
        if (isHover || images.length <= 1) return;
        const t = setInterval(() => {
          setImgIdx((prev) => (prev + 1) % images.length);
        }, 4500);
        return () => clearInterval(t);
      }, [isHover, images.length]);

      return (
        <div 
          onMouseEnter={() => setIsHover(true)}
          onMouseLeave={() => setIsHover(false)}
          className={`rounded-2xl overflow-hidden glass-panel flex flex-col justify-between border border-slate-800 hover:border-gold-500/50 transition-all duration-300 group ${room.type === 'vip' ? 'ring-2 ring-gold-500/40 shadow-gold-glow' : ''}`}
        >
          {/* Horizontal Image Slider */}
          <div className="relative h-64 overflow-hidden select-none bg-navy-950">
            <div 
              className="flex h-full w-full transition-transform duration-500 ease-out"
              style={{ transform: `translateX(-${imgIdx * 100}%)` }}
            >
              {images.map((im, i) => (
                <div key={i} className="min-w-full h-full relative shrink-0">
                  <img src={im} alt={`${room.name} ${i+1}`} className="w-full h-full object-cover" />
                </div>
              ))}
            </div>

            <div className="absolute inset-0 bg-gradient-to-t from-navy-950 via-transparent to-black/30 pointer-events-none"></div>

            {/* Slider Arrows */}
            {images.length > 1 && (
              <>
                <button
                  onClick={(e) => { e.stopPropagation(); setImgIdx((prev) => (prev === 0 ? images.length - 1 : prev - 1)); }}
                  className="absolute left-2.5 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-navy-950/70 hover:bg-gold-500 hover:text-navy-950 text-white backdrop-blur-md flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all border border-slate-700"
                >
                  <Icons.ChevronLeft />
                </button>
                <button
                  onClick={(e) => { e.stopPropagation(); setImgIdx((prev) => (prev + 1) % images.length); }}
                  className="absolute right-2.5 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-navy-950/70 hover:bg-gold-500 hover:text-navy-950 text-white backdrop-blur-md flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all border border-slate-700"
                >
                  <Icons.ChevronRight />
                </button>
              </>
            )}

            {/* Slider Dots */}
            {images.length > 1 && (
              <div className="absolute bottom-3 left-1/2 -translate-x-1/2 flex items-center gap-1.5 z-10">
                {images.map((_, dotI) => (
                  <button
                    key={dotI}
                    onClick={() => setImgIdx(dotI)}
                    className={`transition-all rounded-full ${imgIdx === dotI ? 'w-4 h-1.5 bg-gold-400' : 'w-1.5 h-1.5 bg-white/50'}`}
                  />
                ))}
              </div>
            )}

            {/* Badges */}
            <div className="absolute top-3 left-3 z-10 px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider gold-gradient-bg text-navy-950 flex items-center gap-1">
              {room.type === 'vip' && <Icons.Crown />}
              <span>{room.type}</span>
            </div>

            <div className="absolute top-3 right-3 z-10 bg-navy-950/80 px-2.5 py-1 rounded-full text-xs font-bold text-white border border-slate-700 flex items-center gap-1">
              <Icons.Star className="w-3.5 h-3.5 text-gold-400" />
              <span>{room.rating}</span>
            </div>

            <div className="absolute bottom-3 right-3 z-10 bg-navy-950/90 px-3 py-1 rounded-xl border border-gold-500/30 text-right">
              <div className="text-[10px] text-slate-400">Bir kecha:</div>
              <div className="text-xl font-bold font-serif gold-gradient-text leading-none mt-0.5">${room.price_per_night}</div>
            </div>
          </div>

          {/* Details */}
          <div className="p-5 flex-1 flex flex-col justify-between">
            <div>
              <h3 className="text-xl font-serif font-bold text-white mb-2">{room.name}</h3>
              <div className="flex items-center gap-4 text-xs text-slate-300 mb-3 border-y border-slate-800 py-2">
                <span className="flex items-center gap-1.5"><Icons.Users /> {room.capacity} kishi</span>
                <span className="flex items-center gap-1.5"><Icons.Maximize /> {room.size}</span>
                <span className="flex items-center gap-1.5"><Icons.Bed /> {room.bed_type}</span>
              </div>
              <p className="text-xs text-slate-400 line-clamp-2 mb-4 leading-relaxed">{room.description}</p>
              <div className="space-y-1.5 mb-5">
                {room.amenities.slice(0, 3).map((a, i) => (
                  <div key={i} className="text-xs text-slate-300 flex items-center gap-2">
                    <Icons.Check className="w-3.5 h-3.5 text-gold-400 shrink-0" />

                ))}

            </div>

              onClick={() => onBook(room)}

                room.is_available

              }`}
            >
              {room.is_available ? `Band qilish ($${room.price_per_night})` : 'Band qilingan'}
            </button>
          </div>
        </div>
      );

      const [confirmed, setConfirmed] = useState(null);
      const [error, setError] = useState('');

      const selRoom = rooms.find(r => r.id === parseInt(roomId)) || rooms[0];
      const selBranch = branches.find(b => b.id === branchId) || branches[0];

      // Nights & Price Calc
      let nights = 0;
      let total = 0;
      if (cin && cout) {
        const d1 = new Date(cin);
        const d2 = new Date(cout);
        if (d2 > d1) {
          nights = Math.ceil((d2 - d1) / 86400000);
          total = nights * selRoom.price_per_night;
        }
      }

      const handleSubmit = (e) => {
        e.preventDefault();
        setError('');

        if (!name.trim()) { setError('Ism va familiyangizni kiriting.'); return; }
        if (!phone.trim() || phone.trim() === '+998') { setError('Telefon raqamingizni kiriting.'); return; }
        if (!cin || !cout) { setError('Sanalarni tanlang.'); return; }
        
        const d1 = new Date(cin);
        const d2 = new Date(cout);
        if (d1 >= d2) {
          setError('Kirish sanasi chiqish sanasidan oldin bo‘lishi shart!');
          return;
        }
        if (parseInt(guests) > selRoom.capacity) {
          setError(`${selRoom.name} sig‘imi maksimal ${selRoom.capacity} kishi!`);
          return;
        }

        const booking = {
          id: Date.now(),
          booking_code: 'GH-' + Math.floor(10000 + Math.random() * 90000),
          branch_name: selBranch.name,
          branch_city: selBranch.city,
          room_name: selRoom.name,
          guest_name: name.trim(),
          guest_phone: phone.trim(),
          check_in: cin,
          check_out: cout,
          nights,
          guests_count: parseInt(guests),
          price_per_night: selRoom.price_per_night,
          total_price: total,
          status: 'kutilmoqda'
        };

        setConfirmed(booking);
        onSuccess(booking);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-navy-950/80 backdrop-blur-md overflow-y-auto">
          <div className="relative w-full max-w-lg bg-navy-900 border border-gold-500/30 rounded-3xl p-6 shadow-2xl my-6">
            <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">✕</button>

            {confirmed ? (
              <div className="text-center space-y-4">
                <div className="w-14 h-14 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center mx-auto">
                  <Icons.CheckCircle className="w-8 h-8" />
                </div>
                <h3 className="text-2xl font-serif font-bold text-white">Xona Band Qilindi!</h3>
                <p className="text-xs text-slate-300">Hurmatli <strong className="text-gold-400">{confirmed.guest_name}</strong>, buyurtmangiz qabul qilindi.</p>
                <div className="p-4 rounded-xl bg-navy-950 border border-gold-500/20 text-left text-xs space-y-2">
                  <div className="flex justify-between"><span>Buyurtma ID:</span><span className="font-mono font-bold text-gold-400">{confirmed.booking_code}</span></div>
                  <div className="flex justify-between"><span>Filial:</span><span className="font-semibold text-white">{confirmed.branch_name}</span></div>
                  <div className="flex justify-between"><span>Xona:</span><span className="font-semibold text-white">{confirmed.room_name}</span></div>
                  <div className="flex justify-between"><span>Muddat:</span><span>{confirmed.check_in} — {confirmed.check_out} ({confirmed.nights} kecha)</span></div>
                  <div className="flex justify-between pt-2 border-t border-slate-800 text-sm font-bold"><span>Jami summa:</span><span className="text-gold-400 text-base">${confirmed.total_price}</span></div>
                </div>
                <button onClick={onClose} className="w-full py-3 rounded-xl gold-gradient-bg text-navy-950 font-bold text-xs">Yopish</button>
              </div>
            ) : (
              <form onSubmit={handleSubmit} className="space-y-3.5">
                <h3 className="text-xl font-serif font-bold text-white mb-1">Xona band qilish</h3>
                <p className="text-xs text-slate-400 mb-2">O‘zbekiston bo‘ylab 12 ta viloyat filiallaridan birini tanlang</p>

                {error && <div className="p-2.5 rounded-lg bg-rose-500/20 border border-rose-500/40 text-rose-300 text-xs">{error}</div>}

                {/* Branch Selection */}
                <div>
                  <label className="text-[11px] font-bold text-slate-300 block mb-1 flex items-center gap-1"><Icons.Building /> Mehmonxona filiali / Viloyat *</label>
                  <select value={branchId} onChange={e => setBranchId(e.target.value)} className="w-full px-3 py-2 rounded-xl bg-navy-950 border border-slate-700 text-xs text-white">
                    {branches.map(b => (
                      <option key={b.id} value={b.id} className="bg-navy-900">{b.city} — {b.name} ({b.region})</option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="text-[11px] font-bold text-slate-300 block mb-1">Ism va familiya *</label>
                  <input type="text" value={name} onChange={e => setName(e.target.value)} placeholder="Jamshid Aliyev" className="w-full px-3 py-2 rounded-xl bg-navy-950 border border-slate-700 text-xs text-white" required />
                </div>

                <div>
                  <label className="text-[11px] font-bold text-slate-300 block mb-1">Telefon raqam *</label>
                  <input type="tel" value={phone} onChange={e => setPhone(e.target.value)} className="w-full px-3 py-2 rounded-xl bg-navy-950 border border-slate-700 text-xs text-white" required />
                </div>

                <div>
                  <label className="text-[11px] font-bold text-slate-300 block mb-1">Xona turi *</label>
                  <select value={roomId} onChange={e => setRoomId(e.target.value)} className="w-full px-3 py-2 rounded-xl bg-navy-950 border border-slate-700 text-xs text-white">
                    {rooms.map(r => (
                      <option key={r.id} value={r.id} className="bg-navy-900">{r.name} — ${r.price_per_night}/k (sig‘im: {r.capacity} kishi)</option>
                    ))}
                  </select>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="text-[11px] font-bold text-slate-300 block mb-1">Kirish sanasi *</label>
                    <input type="date" value={cin} onChange={e => setCin(e.target.value)} className="w-full px-2 py-1.5 rounded-xl bg-navy-950 border border-slate-700 text-xs text-white" required />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold text-slate-300 block mb-1">Chiqish sanasi *</label>
                    <input type="date" value={cout} onChange={e => setCout(e.target.value)} className="w-full px-2 py-1.5 rounded-xl bg-navy-950 border border-slate-700 text-xs text-white" required />
                  </div>
                </div>

                <div>
                  <label className="text-[11px] font-bold text-slate-300 block mb-1">Mehmonlar soni *</label>
                  <select value={guests} onChange={e => setGuests(e.target.value)} className="w-full px-3 py-2 rounded-xl bg-navy-950 border border-slate-700 text-xs text-white">
                    {[1, 2, 3, 4, 5].map(n => <option key={n} value={n} className="bg-navy-900">{n} nafar</option>)}
                  </select>
                </div>

                <div className="p-3 rounded-xl bg-navy-950 border border-gold-500/30 flex justify-between items-center text-xs">
                  <div>
                    <div className="text-slate-400">{nights > 0 ? `${nights} kecha × $${selRoom.price_per_night} (${selBranch.city})` : 'Sana xato'}</div>
                  </div>
                  <div className="text-right">
                    <div className="text-[10px] text-slate-400">Jami:</div>
                    <div className="text-xl font-bold font-serif gold-gradient-text">${total}</div>
                  </div>
                </div>

                <button type="submit" className="w-full py-3 rounded-xl gold-gradient-bg text-navy-950 font-bold text-xs shadow-gold-glow">
                  Band qilishni tasdiqlash (${total})
                </button>
              </form>
            )}
          </div>
        </div>
      );
    }

    // Admin Login Modal
    function AdminLoginModalView({ onClose, onSuccess }) {
      const [u, setU] = useState('admin');
      const [p, setP] = useState('grand2026');
      const [err, setErr] = useState('');

      const handleLogin = (e) => {
        e.preventDefault();
        if (u === 'admin' && p === 'grand2026') {
          onSuccess();
        } else {
          setErr('Login yoki parol noto‘g‘ri! (Standart: admin / grand2026)');
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-navy-950/80 backdrop-blur-md">
          <div className="relative w-full max-w-sm bg-navy-900 border border-gold-500/30 rounded-3xl p-6 shadow-2xl">
            <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
            <h3 className="text-lg font-serif font-bold text-white mb-2">Administrator Kirishi</h3>
            <p className="text-xs text-gold-400 mb-4">Standart: admin / grand2026</p>
            {err && <div className="p-2 bg-rose-500/20 text-rose-300 text-xs rounded mb-3">{err}</div>}
            <form onSubmit={handleLogin} className="space-y-3">
              <div>
                <label className="text-xs text-slate-300 block mb-1">Login</label>
                <input value={u} onChange={e => setU(e.target.value)} className="w-full px-3 py-2 bg-navy-950 border border-slate-700 rounded-xl text-xs text-white" />
              </div>
              <div>
                <label className="text-xs text-slate-300 block mb-1">Parol</label>
                <input type="password" value={p} onChange={e => setP(e.target.value)} className="w-full px-3 py-2 bg-navy-950 border border-slate-700 rounded-xl text-xs text-white" />
              </div>
              <button type="submit" className="w-full py-2.5 rounded-xl gold-gradient-bg text-navy-950 font-bold text-xs shadow-gold-glow">
                Kirish
              </button>
            </form>
          </div>
        </div>
      );
    }

    // Admin Dashboard View
    function AdminView({ bookings, setBookings, rooms, setRooms, contacts, onBack, onLogout, showToast }) {
      const [tab, setTab] = useState('bookings');
      const totalRevenue = bookings.filter(b => b.status === 'tasdiqlangan').reduce((acc, b) => acc + (b.total_price || 0), 0);

      const updateStatus = (id, st) => {
        setBookings(prev => prev.map(b => b.id === id ? { ...b, status: st } : b));
        showToast(`Holat "${st}" ga o‘zgartirildi`, 'success');
      };

      const deleteBooking = (id) => {
        if (!confirm("O‘chirmoqchimisiz?")) return;
        setBookings(prev => prev.filter(b => b.id !== id));
        showToast("O‘chirildi", 'info');
      };

      return (
        <div className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-8 space-y-6 pt-20">
          <div className="flex items-center justify-between border-b border-slate-800 pb-4">
            <div className="flex items-center gap-3">
              <button onClick={onBack} className="px-3 py-1.5 rounded-lg bg-navy-800 text-xs font-bold text-gold-400">
                ← Saytga qaytish
              </button>
              <h2 className="text-xl font-serif font-bold text-white">Admin Boshqaruv Paneli (12 Viloyat)</h2>
            </div>
            <button onClick={onLogout} className="px-3 py-1.5 rounded-lg bg-rose-500/20 text-rose-300 text-xs font-bold">
              Chiqish
            </button>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-4 gap-4">
            <div className="p-4 rounded-xl glass-panel border border-gold-500/20">
              <div className="text-xs text-slate-400">Jami Buyurtmalar</div>
              <div className="text-2xl font-serif font-bold text-white mt-1">{bookings.length}</div>
            </div>
            <div className="p-4 rounded-xl glass-panel border border-gold-500/20">
              <div className="text-xs text-slate-400">Jami Tushum</div>
              <div className="text-2xl font-serif font-bold gold-gradient-text mt-1">${totalRevenue}</div>
            </div>
            <div className="p-4 rounded-xl glass-panel border border-gold-500/20">
              <div className="text-xs text-slate-400">Kutilayotganlar</div>
              <div className="text-2xl font-serif font-bold text-amber-400 mt-1">{bookings.filter(b => b.status === 'kutilmoqda').length}</div>
            </div>
            <div className="p-4 rounded-xl glass-panel border border-gold-500/20">
              <div className="text-xs text-slate-400">Bandlik darajasi</div>
              <div className="text-2xl font-serif font-bold text-emerald-400 mt-1">88%</div>
            </div>
          </div>

          <div className="flex gap-2">
            <button onClick={() => setTab('bookings')} className={`px-4 py-2 rounded-xl text-xs font-bold ${tab === 'bookings' ? 'gold-gradient-bg text-navy-950' : 'bg-navy-900 text-slate-300'}`}>
              Buyurtmalar ({bookings.length})
            </button>
            <button onClick={() => setTab('rooms')} className={`px-4 py-2 rounded-xl text-xs font-bold ${tab === 'rooms' ? 'gold-gradient-bg text-navy-950' : 'bg-navy-900 text-slate-300'}`}>
              Xonalar & Narxlar ({rooms.length})
            </button>
            <button onClick={() => setTab('contacts')} className={`px-4 py-2 rounded-xl text-xs font-bold ${tab === 'contacts' ? 'gold-gradient-bg text-navy-950' : 'bg-navy-900 text-slate-300'}`}>
              Murojaatlar ({contacts.length})
            </button>
          </div>

          {tab === 'bookings' && (
            <div className="rounded-2xl overflow-x-auto glass-panel border border-gold-500/20">
              <table className="w-full text-left text-xs">
                <thead className="bg-navy-900 text-slate-400 uppercase text-[10px]">
                  <tr>
                    <th className="p-3">ID</th>
                    <th className="p-3">Filial</th>
                    <th className="p-3">Mehmon</th>
                    <th className="p-3">Xona</th>
                    <th className="p-3">Muddat</th>
                    <th className="p-3">Summa</th>
                    <th className="p-3">Holat</th>
                    <th className="p-3 text-right">Amal</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800">
                  {bookings.map(b => (
                    <tr key={b.id} className="hover:bg-navy-900/50">
                      <td className="p-3 font-mono font-bold text-gold-400">{b.booking_code}</td>
                      <td className="p-3 text-slate-300 font-medium">{b.branch_name || 'Toshkent Bosh bino'}</td>
                      <td className="p-3 font-semibold text-white">{b.guest_name}<div className="text-[10px] text-slate-400">{b.guest_phone}</div></td>
                      <td className="p-3 text-slate-300">{b.room_name}</td>
                      <td className="p-3 text-slate-300">{b.check_in} — {b.check_out} ({b.nights} k)</td>
                      <td className="p-3 font-bold text-gold-400">${b.total_price}</td>
                      <td className="p-3">
                        <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                          b.status === 'tasdiqlangan' ? 'bg-emerald-500/20 text-emerald-400' :
                          b.status === 'bekor_qilingan' ? 'bg-rose-500/20 text-rose-400' :
                          'bg-amber-500/20 text-amber-400'
                        }`}>
                          {b.status}
                        </span>
                      </td>
                      <td className="p-3 text-right space-x-1">
                        {b.status !== 'tasdiqlangan' && (
                          <button onClick={() => updateStatus(b.id, 'tasdiqlangan')} className="px-2 py-1 bg-emerald-500 text-navy-950 font-bold rounded">✓</button>
                        )}
                        {b.status !== 'bekor_qilingan' && (
                          <button onClick={() => updateStatus(b.id, 'bekor_qilingan')} className="px-2 py-1 bg-rose-500 text-white font-bold rounded">✕</button>
                        )}
                        <button onClick={() => deleteBooking(b.id)} className="px-2 py-1 bg-slate-800 text-slate-400 rounded">
                          <Icons.Trash />
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {tab === 'rooms' && (
            <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
              {rooms.map(r => (
                <div key={r.id} className="p-4 rounded-xl glass-panel border border-slate-800 space-y-2">
                  <img src={r.images ? r.images[0] : r.image_url} alt={r.name} className="w-full h-32 object-cover rounded-lg" />
                  <div className="font-bold text-white text-sm">{r.name}</div>
                  <div className="text-xs text-slate-400">{r.capacity} kishi • {r.size}</div>
                  <div className="flex items-center justify-between text-xs pt-2 border-t border-slate-800">
                    <span className="font-bold text-gold-400">${r.price_per_night} / kecha</span>
                    <button
                      onClick={() => {
                        const val = prompt('Yangi narxni kiriting ($):', r.price_per_night);
                        if (val && !isNaN(val)) {
                          setRooms(prev => prev.map(item => item.id === r.id ? { ...item, price_per_night: Number(val) } : item));
                          showToast('Narx yangilandi', 'success');
                        }
                      }}
                      className="px-2 py-0.5 bg-navy-800 text-gold-300 rounded text-[11px]"
                    >
                      Tahrirlash
                    </button>
                  </div>
                </div>
              ))}
            </div>
          )}

          {tab === 'contacts' && (
            <div className="space-y-3">
              {contacts.length === 0 ? (
                <div className="p-6 text-center text-slate-400 glass-panel rounded-xl">Xabarlar yo‘q</div>
              ) : (
                contacts.map(c => (
                  <div key={c.id} className="p-4 rounded-xl glass-panel border border-slate-800">
                    <div className="font-bold text-white text-sm">{c.name} ({c.phone})</div>
                    <div className="text-xs text-slate-300 mt-1">"{c.message}"</div>
                  </div>
                ))
              )}
            </div>
          )}
        </div>
      );
    }

    // Render Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<GrandHotelApp />);
  </script>
</body>
</html>
